name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  package:
    # Installs the packed tarball the way a user would and runs the binary
    # through node_modules/.bin. On Linux that entry is a symlink, which is
    # exactly the path on which an entry point that checks "was I invoked
    # directly?" silently exits 0 without running. The in-process tests
    # cannot see this; only an install can.
    name: Installed package runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Pack the tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install it into a fresh project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer
          cd consumer
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/timiagama-ecr-*.tgz

      - name: Run the installed binary
        working-directory: ${{ runner.temp }}/consumer
        run: |
          set -euo pipefail
          test -L node_modules/.bin/ecr   # the symlink the bug depended on

          npx ecr --version | grep -E '^ecr [0-9]+\.[0-9]+\.[0-9]+ \(ECR spec'
          npx ecr stats --example | grep -E 'total edges +38'
          npx ecr lint --example

          npx ecr init docs
          test -f docs/ECR-NAVIGATION-PROTOCOL.md

          # A broken corpus must fail the build, not pass silently.
          printf '# 4.2 - Contract\n\nNo References section.\n' > docs/4.2.md
          if npx ecr lint docs; then
            echo "ecr lint exited 0 on a broken corpus" >&2
            exit 1
          fi
